services:
  app:
    build:
      context: .
      args:
        APP_COMMIT: ${APP_COMMIT:-}   # e.g. APP_COMMIT=$(git rev-parse --short HEAD) docker compose build
    image: proud-ledger:latest
    container_name: proud-ledger
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: sqlite:////data/finance.db
    ports:
      - "8000:8000"
    volumes:
      - ft-data:/data

volumes:
  ft-data:
